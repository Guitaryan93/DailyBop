<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="utf-8">
    <title>Daily Bop</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Daily Bop</h1>
            <em>Music you won’t find in the algorithm.</em>
        </div>

        <!-- Music Card -->
        <div class="card">
            {% if artist %}
                {% if artist.YT_embed %}
                    <iframe width="420" height="315" src="{{ artist.YT_embed }}" ></iframe>
                {% elif artist.thumbnail %}
                    <img src="{{ artist.thumbnail }}" alt="artist image" />
                {% endif %}
                <h2>{{ artist.name }}</h2>
                <p>{{ artist.song_title }}</p>
            {% else %}
                <h2>Oops... Something went wrong.</h2>
                <p>Try again tomorrow...</p>
            {% endif %}
        </div>

        <!-- Streaming Services SVG Link Icons -->
        <div class="card">
            {% for s in svg_list %}
                <a href="{{ s.url }}" target="_blank" title="{{ s.name }}">
                    <img src="{{ s.svg }}" alt="{{ s.service }} icon"/>
                </a>
            {% endfor %}
        </div>

    </div>
</body>
</html>
